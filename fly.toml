# fly.toml app configuration file generated for iso8583-payment-engine on 2026-08-21T02:10:02+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'iso8583-payment-engine'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  JAVA_OPTS = '-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/actuator/health'

[[services]]
  protocol = 'tcp'
  internal_port = 8583
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[services.ports]]
    port = 8583

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'

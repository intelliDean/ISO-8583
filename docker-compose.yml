name: iso8583-payment-stack

services:
  # ---------------------------------------------------------------------------
  # 1. ISO 8583 Payment Engine & Switch Server
  # ---------------------------------------------------------------------------
  iso-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iso-engine
    restart: unless-stopped
    ports:
      - "8080:8080"  # HTTP REST API, Web UI, Actuator & Prometheus
      - "8583:8583"  # Binary TCP ISO 8583 Host Socket
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - ISO_TCP_HOST=0.0.0.0
      - ISO_TCP_PORT=8583
      - ISO_ECHO_ENABLED=true
      - ISO_ECHO_INTERVAL_SECONDS=30
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/iso_payment_db
      - SPRING_DATASOURCE_USERNAME=iso_user
      - SPRING_DATASOURCE_PASSWORD=iso_secret
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - payment-network

  # ---------------------------------------------------------------------------
  # 2. PostgreSQL 16 - Relational Persistence & Settlement Store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: iso-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: iso_payment_db
      POSTGRES_USER: iso_user
      POSTGRES_PASSWORD: iso_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iso_user -d iso_payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payment-network

  # ---------------------------------------------------------------------------
  # 3. Redis 7 - High-Speed Distributed Clustered Lock Service
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: iso-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payment-network

  # ---------------------------------------------------------------------------
  # 4. Zookeeper & Apache Kafka 3.x - Transactional Outbox Event Bus
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: iso-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - payment-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: iso-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    networks:
      - payment-network

  # ---------------------------------------------------------------------------
  # 5. Prometheus - Time-Series Metrics & Alerting Engine
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: iso-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - payment-network

  # ---------------------------------------------------------------------------
  # 6. Grafana - Telemetry & Operational Metrics Dashboard
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: iso-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - payment-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  payment-network:
    driver: bridge

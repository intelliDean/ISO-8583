spring:
  application:
    name: iso8583

  threads:
    virtual: #virtual threads on
      enabled: true

server:
  port: 8080

iso:
  tcp:
    host: ${ISO_TCP_HOST:localhost}
    port: ${ISO_TCP_PORT:8583}
    max-frame-length: ${ISO_TCP_MAX_FRAME_LENGTH:8192}
    shutdown-timeout: 10
    tls:
      enabled: ${ISO_TCP_TLS_ENABLED:false}
      keystore-path: ${ISO_TCP_TLS_KEYSTORE_PATH:classpath:certs/server-keystore.p12}
      keystore-password: ${ISO_TCP_TLS_KEYSTORE_PASSWORD:changeit}
      truststore-path: ${ISO_TCP_TLS_TRUSTSTORE_PATH:classpath:certs/server-truststore.p12}
      truststore-password: ${ISO_TCP_TLS_TRUSTSTORE_PASSWORD:changeit}
      client-auth: ${ISO_TCP_TLS_CLIENT_AUTH:NONE}
  echo:
    enabled: ${ISO_ECHO_ENABLED:false}
    interval-seconds: ${ISO_ECHO_INTERVAL_SECONDS:30}
    failure-threshold: ${ISO_ECHO_FAILURE_THRESHOLD:3}
    timeout-ms: ${ISO_ECHO_TIMEOUT_MS:5000}
    tpdu-header: ${ISO_ECHO_TPDU_HEADER:6000000000}